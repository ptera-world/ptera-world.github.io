<!DOCTYPE html>
<html lang="en" data-collection="prose">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>prose — ptera.world</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <!-- inserted from script: a preload the parser makes is never reused by the page script's fetch when a service worker answers both -->
  <script>{const l=document.createElement("link");l.rel="preload";l.as="fetch";l.crossOrigin="anonymous";l.href="/prose/graph.json";document.head.append(l)}</script>
</head>
<body>
  <div id="app">
    <div id="viewport" role="application" aria-roledescription="spatial graph">
      <div id="world">
        <div id="card" hidden role="dialog" aria-label="Node details"></div>
      </div>
      <div id="filter-bar"></div>
      <div id="grouping-bar"></div>
    </div>
    <div id="panel" hidden role="complementary" aria-label="Project details">
      <div id="panel-divider"></div>
      <div id="panel-content">
        <div id="panel-header">
          <h2 id="panel-title"></h2>
          <span id="panel-actions">
            <a id="panel-open" href="/" target="_blank" title="Open in new tab">&#x2197;</a>
            <button id="panel-close" aria-label="Close panel">&times;</button>
          </span>
        </div>
        <div id="panel-body"></div>
      </div>
    </div>
  </div>
  <div id="live-region" class="sr-only" aria-live="polite"></div>
  <script type="module" src="/main.js"></script>
  <script src="/register-sw.js" defer></script>
</body>
</html>
